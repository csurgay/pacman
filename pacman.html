    test('Touch: 10 buttons present', () => {
      for (const k of ['ArrowUp', 'ArrowLeft', 'ArrowRight', 'ArrowDown', '0', '1', '2', '3', '4', 'Tab'])
        ok(touchEl.querySelector('button[data-key="' + k + '"]'), 'missing ' + k);
    });
    test('Touch d-pad steers Pac-Man', () => {
      fresh();
      for (const [k, d] of [['ArrowUp', DIR.up], ['ArrowRight', DIR.right], ['ArrowDown', DIR.down], ['ArrowLeft', DIR.left]]) {
        press(k); eq(input.desired, d, k);
      }
      placePac(3, 7, DIR.left); press('ArrowRight'); sim(20); ok(pacman.x > pixelCenter(3, 7).x, 'did not move right');
    });
    test('Touch 0 toggles manual mode', () => {
      fresh();
      try { press('0'); ok(manualMode, 'not on'); ok(ghosts.every(g => ghostLabel(g) === 'HOME'), 'not home'); press('0'); ok(!manualMode, 'not off'); }
      finally { manualMode = false; }
    });
    test('Touch 1-4 step each ghost', () => {
      fresh();
      try {
        press('0');
        for (let i = 0; i < 4; i++) {
          press(String(i + 1));
          ok(ghosts[i].released, ghosts[i].name + ' not released');
          let f = 0; while (ghosts[i].inHouse && f++ < 600) step(FRAME);
          eq(ghostLabel(ghosts[i]), 'SCATTER', ghosts[i].name);
        }
      } finally { manualMode = false; }
    });
    test('Touch 1-4 do nothing in rules mode', () => {
      fresh(); const before = ghosts.map(ghostLabel).join();
      for (const k of ['1', '2', '3', '4']) press(k);
      eq(ghosts.map(ghostLabel).join(), before);
    });
    test('Touch TAB toggles state bubbles', () => {
      const was = showBubbles;
      try { showBubbles = false; press('Tab'); ok(showBubbles, 'not on'); press('Tab'); ok(!showBubbles, 'not off'); }
      finally { showBubbles = was; }
    });
    test('Swipe on the screen steers', () => {
      fresh(); const r = canvas.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const swipeTo = (dx, dy) => {
        canvas.dispatchEvent(new PointerEvent('pointerdown', { clientX: cx, clientY: cy, bubbles: true }));
        canvas.dispatchEvent(new PointerEvent('pointermove', { clientX: cx + dx, clientY: cy + dy, bubbles: true }));
        canvas.dispatchEvent(new PointerEvent('pointerup', { clientX: cx + dx, clientY: cy + dy, bubbles: true }));
      };
      swipeTo(0, -40); eq(input.desired, DIR.up, 'up');
      swipeTo(40, 0); eq(input.desired, DIR.right, 'right');
      swipeTo(0, 40); eq(input.desired, DIR.down, 'down');
      swipeTo(-40, 0); eq(input.desired, DIR.left, 'left');
      input.desired = DIR.up; swipeTo(5, 4); eq(input.desired, DIR.up, 'tiny move should not steer');
    });

    // ---------- manual mode ----------
    test('Manual: all ghosts HOME, frozen', () => {
      fresh(); sim(120); toggleManual();
      try {
        ok(ghosts.every(g => ghostLabel(g) === 'HOME'), ghosts.map(ghostLabel).join());
        const m = modeTimer; sim(600);
        ok(ghosts.every(g => ghostLabel(g) === 'HOME'), 'left home'); eq(modeTimer, m, 'mode timer');
      } finally { manualMode = false; }
    });
    test('Manual: 1-4 step the cycle', () => {
      fresh(); toggleManual();
      try {
        const g = G('inky'), seq = [];
        stepGhostState(2); let f = 0; while (g.inHouse && f++ < 600) step(FRAME); seq.push(ghostLabel(g));
        stepGhostState(2); seq.push(ghostLabel(g));
        stepGhostState(2); seq.push(ghostLabel(g));
        stepGhostState(2); seq.push(ghostLabel(g));
        f = 0; while (g.state === 'eyes' && f++ < 3000) step(FRAME); seq.push(ghostLabel(g));
        eq(seq.join('>'), 'SCATTER>CHASE>EVADE>DEAD>HOME');
      } finally { manualMode = false; }
    });

    for (let i = 0; i < tests.length; i++) {
      const tst = tests[i];
      let pass = true, err = '';
      try { tst.fn(); } catch (e) { pass = false; err = e.message; }
      results.push({ n: i + 1, name: tst.name, pass, err });
    }
    // back to a normal game
    testNoDeath = false; manualMode = false; eatPauseTimer = 0;
    showBubbles = saved.showBubbles; highScore = saved.highScore;
    startGame();
    const passed = results.filter(r => r.pass).length;
    console.log('AUTOTEST ' + passed + '/' + results.length + ' passed');
    console.table(results.map(r => ({ '#': r.n, test: r.name, result: r.pass ? 'PASS' : 'FAIL', error: r.err })));
    return { results, passed };
  }

  function drawTestReport() {
    if (!testReport) return;
    const { results, passed } = testReport;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.92)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.textBaseline = 'top';
    arcadeText('AUTOTEST  ' + passed + '/' + results.length + ' PASSED', 8, 6, passed === results.length ? '#7ddc4c' : '#ff5050', 8);
    ctx.font = '4.6px Arial';
    const half = Math.ceil(results.length / 2);
    results.forEach((r, i) => {
      const col = i < half ? 0 : 1, row = i < half ? i : i - half;
      const x = 6 + col * 110, y = 22 + row * Math.min(9.4, 236 / half);
      ctx.fillStyle = r.pass ? '#7ddc4c' : '#ff5050';
      ctx.fillText((r.pass ? 'OK  ' : 'FAIL ') + String(r.n).padStart(2, '0'), x, y);
      ctx.fillStyle = '#e8e8f0';
      ctx.fillText(r.name, x + 20, y);
      if (!r.pass) { ctx.fillStyle = '#ff9a9a'; ctx.fillText(r.err.slice(0, 40), x + 20, y + 4.6); }
    });
    ctx.fillStyle = '#9aa0b8';
    ctx.font = '5px Arial';
    ctx.fillText('T: close and restart   (details in the browser console)   config: ' + configSource + ', speeds: ' + CFG.profileName, 8, HEIGHT - 9);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    drawMaze();
    if (fruit) at16(fruit.x, fruit.y, drawFruit);
    at16(pacman.x, pacman.y, drawPacman);
    for (let i = 0; i < ghosts.length; i++) at16(ghosts[i].x, ghosts[i].y, () => drawGhost(ghosts[i]));
    drawBubbles();
    drawTextPopup(frightenedScorePopup);
    drawTextPopup(fruitAward, '#ffb8ff');
    drawUI();
    drawTestReport();
  }

  function step(dt) {
    updateTimers(dt);
    updateMode(dt);
    updateFruit(dt);
    updatePacman();
    for (let i = 0; i < ghosts.length; i++) updateGhost(ghosts[i]);
    collide();
  }

  function loop(ts) {
    if (!lastTimestamp) lastTimestamp = ts;
    let dt = (ts - lastTimestamp) / 1000;
    if (dt > 0.05) dt = 0.05;
    lastTimestamp = ts;

    const fixed = 1 / 60;
    accumulator += dt;
    if (testReport) accumulator = 0;
    while (accumulator >= fixed) {
      step(fixed);
      accumulator -= fixed;
    }

    draw();
    requestAnimationFrame(loop);
  }

  // Keyboard keys and the on-screen buttons all end up here.
  function handleKey(key) {
    if (key === 'ArrowLeft') input.desired = DIR.left;
    else if (key === 'ArrowRight') input.desired = DIR.right;
    else if (key === 'ArrowUp') input.desired = DIR.up;
    else if (key === 'ArrowDown') input.desired = DIR.down;
    else if (key === 'r' || key === 'R') loadConfig().then(startGame);
    else if (key === 't' || key === 'T') {
      if (testReport) { testReport = null; startGame(); }
      else testReport = runAutotests();
    }
    else if (testReport) return;
    else if (key === '0') toggleManual();
    else if (key === 'Tab') showBubbles = !showBubbles;
    else if (manualMode && key >= '1' && key <= '4') stepGhostState(Number(key) - 1);
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Tab' || e.key.startsWith('Arrow')) e.preventDefault();
    handleKey(e.key);
  });

  // on-screen buttons
  for (const b of touchEl.querySelectorAll('button')) {
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      b.classList.add('on');
      handleKey(b.dataset.key);
    });
    const off = () => b.classList.remove('on');
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('pointerleave', off);
  }

  // swipe on the game screen to steer
  let swipe = null;
  const SWIPE_MIN = 18;   // CSS pixels
  canvas.addEventListener('pointerdown', (e) => { swipe = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointermove', (e) => {
    if (!swipe) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    handleKey(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
    swipe = { x: e.clientX, y: e.clientY };
  });
  const endSwipe = () => { swipe = null; };
  canvas.addEventListener('pointerup', endSwipe);
  canvas.addEventListener('pointercancel', endSwipe);

  loadConfig().then(() => {
    startGame();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
